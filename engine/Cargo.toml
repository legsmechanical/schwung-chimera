[workspace]
resolver = "3"
members = ["crates/chimera", "crates/chimera-cli", "crates/chimera-move"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "unwind" # a panic is caught at the C ABI (chimera-move), never kills the host
debug = false

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 3
