name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Full history: the last step checks out main to update release.json, and this job runs
      # on a TAG.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION=$(jq -r .version src/module.base.json)
          if [ "$TAG_VERSION" != "$MODULE_VERSION" ]; then
            echo "ERROR: tag $TAG_VERSION does not match src/module.base.json version $MODULE_VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The generator (node), the Docker cross-compile, and the release checks (glibc <= 2.34,
      # one exported symbol, no dynamic C runtime).
      - name: Build
        run: ./scripts/build.sh

      - name: Native tests
        run: ./scripts/test.sh --engine

      # The generated files are committed; a stale commit would ship a module.json whose params
      # do not match the plugin.
      - name: Check generated files are current
        run: |
          GEN="src/module.json src/dsp/params_gen.h engine/crates/chimera-move/src/params_gen.rs"
          if ! git diff --quiet -- $GEN; then
            echo "ERROR: generated files are stale. Run scripts/build.sh and commit the result."
            git diff --stat -- $GEN
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/chimera-module.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Merge into release.json (it also carries name + description).
      - name: Update release.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/chimera-module.tar.gz"
          git fetch origin main
          git checkout -f main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          jq --arg v "$VERSION" --arg u "$URL" '.version = $v | .download_url = $u' release.json > release.json.tmp
          mv release.json.tmp release.json
          git add release.json
          git commit -m "chore: update release.json for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main
